[project]
name = "dqgen"
version = "0.1.0"
description = "LLM-Assisted Generation of Data Quality Constraints from Schema and Documentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "duckdb>=1.1",
    "great-expectations==1.23.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tenacity>=8.3",
    "matplotlib>=3.8",
    "requests>=2.32",
]

[project.scripts]
dqgen = "dqgen.run:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
